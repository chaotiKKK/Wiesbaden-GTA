[/Script/Engine.RendererSettings]
; Beide Werte waren in dieser Datei NICHT gesetzt und sind hier nur noch
; ausdruecklich festgehalten.
;
; Anlass war die Vermutung, die dunklen Schattenfassaden kaemen von fehlendem
; indirektem Licht. Das Setzen hat am Bild NICHTS geaendert (Vergleich
; Saved/Diagnose/Stadt00070 gegen Stadt00071) - Lumen war also bereits aktiv,
; und die Vermutung war falsch. Der Eintrag bleibt, weil er den Zustand
; dokumentiert, nicht weil er etwas repariert haette.
;
; Was am milchigen Gesamteindruck tatsaechlich etwas aendert, ist bislang nur
; die Staerke des Himmelslichts (siehe EnsureLightingActors). Die dunklen
; Schattenseiten sind damit NICHT erklaert - die Putztextur der Fassaden ist
; mit gemessen 0,382 linearer Albedo hell, die Ursache liegt also woanders und
; ist noch offen.
;
; Lumen AUS.
;
; Gemessen ueber je fuenf Minuten Spielbetrieb, gleiche Strecke:
;   Lumen an :  138,8 / 150,5 / 174,6 ms Bildzeit
;   Lumen aus:  128,1 / 132,1 /  97,5 ms
; also rund 23 Prozent schneller. Auf den Straengen einzeln gemessen war der
; Unterschied noch groesser (Spiel-Strang 886 gegen 79 ms in Momentaufnahmen).
;
; Der Grund liegt in der Bauweise dieser Stadt: Lumens Oberflaechen-
; Zwischenspeicher legt Karten fuer JEDEN Mesh-Abschnitt an, und davon gibt es
; hier 10.325 prozedurale. Ein gutes Stueck dieser Arbeit laeuft im
; Spiel-Strang.
;
; Zurueckschalten zum Vergleich: der Startschalter -WbLumen.
r.DynamicGlobalIlluminationMethod=0

; Reflexionen: 2 = Screen Space, ausdruecklich.
;
; Hier standen zwei Zeilen mit derselben Variablen - erst 0, dann 1 - und die
; letzte gewinnt. 1 bedeutet LUMEN-Reflexionen, also genau das, was der
; Kommentar darueber ausschliessen will. Der Wert tat etwas anderes als seine
; Begruendung.
r.ReflectionMethod=2

; Hardware-Raytracing als ENABLER (nicht als Default-Beleuchtung).
;
; Software-Lumen rechnet fuer diese Stadt KEIN Bounce-Light: es traced das
; globale Distanzfeld, und Procedural-Meshes (die gestreamten Gebaeude) nehmen
; an der Distanzfeld-Generierung gar nicht teil - Lumen "sieht" sie also nicht.
; Der einzige Weg zu echtem Bounce ist Hardware-Raytracing: UProceduralMesh-
; Component baut RT-Geometrie (RHI_RAYTRACING), und Lumen-HWRT trifft die echten
; Dreiecke statt eines leeren Distanzfelds.
;
; r.RayTracing schaltet die RT-Unterstuetzung frei (Shader-Permutationen, BLAS) -
; das ist eine Startzeit-Vorgabe und muss hier stehen, nicht per Konsole. Lumen
; selbst bleibt AUS (r.DynamicGlobalIlluminationMethod=0 oben); erst der
; Startschalter -WbLumenHW schaltet Lumen-GI + r.Lumen.HardwareRayTracing zur
; Laufzeit ein. So bleibt der Default-Build unveraendert und A/B-vergleichbar.
r.RayTracing=True

; PFLICHT-Begleiter von r.RayTracing: ohne den GPU-Skin-Cache bricht der Start
; hart ab ("Ray tracing requires skin cache to be enabled",
; RenderUtils.cpp:1045). Skelettale Meshes (Beetle, Fussgaenger) muessen fuer die
; RT-Szene ueber den Compute-Skin-Cache laufen; 1 kompiliert die noetigen Shader.
r.SkinCache.CompileShaders=1

; Kantenglaettung: TAA statt TSR.
;
; TSR fuehrt seine Historie bei Stufe "Epic" in doppelter Bildaufloesung -
; bei 1280 x 720 also in 2560 x 1440, der vierfachen Pixelzahl. Gemessen mit
; `stat gpu` im laufenden Betrieb, gleiche Stelle (Cranachstrasse), je drei
; Fenster:
;
;   Verfahren                  Bildzeit   GPU gesamt   davon Glaettung   Aussetzer >50ms
;   TSR, Historie 200 Prozent   54,7 ms     52,93 ms         23,66 ms         275
;   TSR, Historie 100 Prozent   48,3 ms     46,62 ms         17,69 ms          10-28
;   TAA                         31,0 ms     28,94 ms          1,33 ms           0-4
;
; Die letzte Spalte ist der Grund fuer die Entscheidung. Nicht die mittlere
; Bildzeit wird als Ruckeln wahrgenommen, sondern die Ausreisser - und die
; verschwinden praktisch vollstaendig.
;
; Der Preis: TAA ist weicher als TSR und neigt bei schnellen Bewegungen zu
; Schlieren. Bei einem Fahrspiel ist das die Stelle, an der man hinschauen
; muss; bei 720p auf einer RTX 3050 Ti Laptop wiegt das die 24 ms nicht auf.
;
; Zum Vergleichen ohne Aenderung an dieser Datei: -WbAA=1 (TSR mit Historie
; 100), -WbAA=2 (TAA), -WbAA=3 (FXAA), -WbAA=4 (aus). NICHT ueber -ExecCmds -
; eine Vorgabe aus dieser Datei greift davor, und der Vergleichslauf misst
; dann zweimal dasselbe.
r.AntiAliasingMethod=2

; Schatten: weniger Stufen, kleinere Karten, kuerzere Reichweite.
;
; Nach der Sichtweitenbegrenzung der Vegetation ist der Schattendurchgang der
; groesste GPU-Posten. Gemessen mit `stat gpu`, gleiche Stelle, 1600 x 900:
;
;   Zustand                          GPU gesamt   Basepass   Prepass   Schatten
;   Kegel als Platzhalter              35 ms        3,7       2,4        7,0
;   echte Baeume ohne Sichtweite      102,5 ms     34,8      32,0       16,3
;   echte Baeume mit Sichtweite        44,5 ms      6,8       5,2       13,4
;
; Der Sprung bei Basepass UND Prepass in der mittleren Zeile war der Hinweis:
; Der Tiefendurchgang schreibt nur Tiefe, hat also den billigstmoeglichen
; Pixelschritt. Springt ausgerechnet der von 2,4 auf 32 ms, liegt es an roher
; Dreiecksmenge und nicht an Material oder Beschattung.
;
; Uebrig bleiben 13,4 ms Schatten. Wiesbaden liegt an den Taunushaengen, die
; Kaskaden decken damit viel Wald ab.
;
; REVIDIERT nach dem Absenken des Sonnenstands auf ein tiefes Streiflicht
; (pitch=-24, Commit 7ca04e2): das alte 70-Prozent-Regime (~140 m) war fuer den
; damals fast senkrechten Sonnenstand (kurze Schatten) getunt. Beim flachen
; Streiflicht RISSEN die langen Gebaeude-/Baumschatten bei ~140 m sichtbar ab -
; per Top-Down-HighResShot geprueft (Saved/_shots/shadow_topdown_before.png).
; Angehoben auf 4 Stufen / 2048 Punkte / 180 Prozent Reichweite (~360 m); deckt
; die Schatten jetzt voll ab (shadow_topdown_balanced.png, identisch zum teureren
; 6/4096-Boost). Vertretbar, weil die gebackene Karte am Boden SPIEL-STRANG-
; gebunden ist (GPU nur ~3,6 ms, reichlich Schatten-Headroom).
r.Shadow.CSM.MaxCascades=4
r.Shadow.MaxCSMResolution=2048
r.Shadow.DistanceScale=1.8

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Shader Model 6 statt 5.
;
; Anlass war eine Editor-Meldung: "Shader Model 6 (SM6) ist erforderlich, um
; Nanite-Assets zu verwenden." Die Mesh-Importe dieses Projekts schalten
; Nanite ein, weil das in UE 5.8 die Vorgabe ist - das Protokoll zeigt den
; geladenen NaniteBuilder. Ohne SM6 werden solche Assets nicht richtig
; dargestellt.
;
; Die Karte kann es. Aus demselben Protokoll:
;
;   Max supported Feature Level 12_2, shader model 6.7, binding tier 3,
;   wave ops supported, atomic64 supported
;   Skipped NVAPI RT queries since we the feature level is below SM6
;
; Also: Hardware 6.7, Projekt 5. Das war nie eine Entscheidung, sondern eine
; nie gesetzte Vorgabe.
;
; WARUM ES SICH LOHNT: Die Baeume haben 34.000 bis 356.000 Dreiecke, und ohne
; Nanite mussten sie auf 400 m Sichtweite begrenzt werden, damit die Stadt
; zeichenbar bleibt (gemessen: ohne Begrenzung 102,5 ms GPU, mit 44,5 ms).
; Nanite zeichnet nach Bildschirmflaeche statt nach Dreieckszahl - genau das
; Problem dieser Stadt.
;
; WAS ES KOSTET: Ein vollstaendiger Shader-Neubau, einmalig. Und ALLE
; Messungen dieser Sitzung werden ungueltig - 43 ms stehend, 32-38 ms fahrend,
; die Aufteilung nach Durchgaengen. Die muessen neu erhoben werden, bevor
; irgendeine Aussage ueber die Leistung wieder gilt.
;
; Zurueck geht es ueber diese eine Zeile: PCD3D_SM5 statt SM6.
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D12TargetedShaderFormats=PCD3D_SM5
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[DevOptions.Shaders]
; Weniger Shader-Uebersetzer gleichzeitig.
;
; Die SM6-Umstellung loest eine vollstaendige Neuuebersetzung aus, und der
; erste Versuch ist daran gestorben:
;
;   Ran out of memory allocating 4096 bytes.
;   Die Auslagerungsdatei ist zu klein, um diesen Vorgang durchzufuehren.
;
; Der Rechner hat 15,7 GB. Unreal startet vorgabegemaess einen Uebersetzer je
; logischem Kern - hier 16 - und jeder belegt mehrere hundert Megabyte. Zwei
; Kerne bleiben fuer Editor und System frei, und die Uebersetzung dauert
; laenger. Sie ist einmalig; ein Absturz kostet mehr.
NumUnusedShaderCompilingThreads=6
WorkerProcessPriority=0

[SystemSettings]
; Grafikspeicher: der Texturvorrat muss in die Karte passen.
;
; Im Spiellauf vom 31.08. stand oben links in Rot:
;   "Video memory has been exhausted (473.557 MB over budget).
;    Expect extremely poor performance."
;
; Die Karte hat 3965 MB. Unreals Vorgabe fuer den Texturvorrat sind 1000 MB,
; und die werden RESERVIERT, ohne zu pruefen, ob daneben noch Platz fuer
; Geometrie, Schattenkarten und Renderziele bleibt. Bei 2.060 Streaming-Zellen
; mit prozeduralen Netzen bleibt er nicht.
;
; Sichtbar war das als schwankende Bildzeit: die Grafikkarte lag zwischen
; 44 und 146 ms, weil Texturen dauernd nachgeladen und wieder verworfen
; wurden. Kein Shader-Problem - ein Speicherproblem.
;
; LimitPoolSizeToVRAM laesst Unreal den Vorrat an der tatsaechlich freien
; Kartenkapazitaet ausrichten statt an einer festen Zahl. Der kleinere
; Grundwert kostet Schaerfe an weit entfernten Flaechen; ein Ruckeln kostet
; mehr.
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=600
