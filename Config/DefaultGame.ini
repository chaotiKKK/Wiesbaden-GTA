; Stadt-Materialien fuer den Laufzeit-Build (ungebackene Stadt). Der gebackene
; Pfad holt sie ueber AWiesbadenWorldBuilder::EnsureDefaultMaterials; hier
; stehen sie fuer WiesbadenGameInstance::ApplyMaterialsToCityActor.
; Ohne diese Zuweisung rendert UProceduralMeshComponent kommentarlos mit dem
; Default-Material (graues Schachbrett).
RoadMaterial=/Game/Materials/AAA/M_AAA_RoadAsphalt.M_AAA_RoadAsphalt
SidewalkMaterial=/Game/Materials/AAA/M_AAA_Paving.M_AAA_Paving
BuildingWallMaterial=/Game/Materials/AAA/M_AAA_FacadePlaster.M_AAA_FacadePlaster
BuildingRoofMaterial=/Game/Materials/AAA/M_AAA_RoofClay.M_AAA_RoofClay
TerrainMaterial=/Game/Materials/AAA/M_AAA_TerrainGrass.M_AAA_TerrainGrass

[/Script/UnrealEd.ProjectPackagingSettings]
; Karten fuer den Cook: die Default-Karte UND die Abnahme-Karte Alkis32.
; Ohne diese Eintraege kocht nur die Default-Karte (gemessen am 01.10.2026:
; das erste datierte Paket enthielt Alkis32 mit 0 Manifest-Eintraegen).
; Die Default-Karte wird erst nach der Abnahme umgestellt (WB_LIVE_SCHALTEN).
+MapsToCook=/Game/Maps/WiesbadenCity_Alkis31
+MapsToCook=/Game/Maps/WiesbadenCity_Alkis32
; Diese Assets werden zur Laufzeit ueber kanonische Pfade geladen und haengen
; deshalb nicht zwingend an einer im Paket sichtbaren Asset-Referenz.
+DirectoriesToAlwaysCook=(Path="/Game/Materials/City")
+DirectoriesToAlwaysCook=(Path="/Game/Materials/PostProcess")
+DirectoriesToAlwaysCook=(Path="/Game/Textures/TrafficSigns")
+DirectoriesToAlwaysCook=(Path="/Game/Assets/People")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Mix")
+DirectoriesToAlwaysCook=(Path="/Game/Props/DFI")
+DirectoriesToAlwaysCook=(Path="/Game/Vehicles/Bus")
+DirectoriesToAlwaysCook=(Path="/Game/Vehicles/Traffic")

; Paketvertrag fuer dynamische Runtime-Lader (kein CookAll).
; Meta: Boxer, Ambience und vier Fussschritte; Samples: Fahrzeug/Reifen/SFX.
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Meta")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Samples")
; Die Ansageindizes unten laden die Wellen nach Haltenamen.
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Bus/Announce")
; Halle/Mast/DFI sowie Tower-Dachprops; referenzierte Materialien/Texturen
; nimmt der Cooker mit. Keine Blender-/PNG-Quellen als Laufzeitdateien.
+DirectoriesToAlwaysCook=(Path="/Game/Props/EsweHalte")
+DirectoriesToAlwaysCook=(Path="/Game/SebboTower/Meshes")
; Enthaltene Kaefer-Geometrie ist bereits hart referenziert, das dynamisch
; geladene M_WbBeetleLamp braucht dieselbe begrenzte Asset-Familie im Cook.
+DirectoriesToAlwaysCook=(Path="/Game/Vehicles/Beetle/Restored")
; Kaeferpanzer: SM_Insekt_*-Teile werden per Format-String geladen
; (WiesbadenBugTankPawn) und haengen damit nicht an einer Asset-Referenz.
+DirectoriesToAlwaysCook=(Path="/Game/Vehicles/BugTank")

; Details zum Vertrag: docs/reference/runtime-paketinhalt.md.
; Der Check belegt Pfade/Regeln, NICHT einen Cook oder eine EXE-Abnahme.

; Spieldaten komprimiert lassen (Vorgabe) - die Alternative wurde gemessen.
;
; Gleiche Fahrt (-WbAutoDrive=50), 1600 x 900, je acht Fenster:
;
;   Build                        Bildzeit    Ausreisser   Kollisions-Kochen   Ladezeit
;   Editor (lose Dateien)        32-38 ms      0-6            826              8:44
;   Paket, komprimiert, kalt     37-47 ms      0-27             0              0:49
;   Paket, komprimiert, warm     36-47 ms      0-24             0
;   Paket, UNKOMPRIMIERT         36-47 ms      0-26             0
;
; Zwei meiner Vermutungen sind daran gescheitert:
;
; 1. "Das Paket beseitigt das Ruckeln, weil es das Kollisions-Kochen
;    mitbringt." Das Kochen faellt tatsaechlich von 826 auf 0 - und die
;    Ausreisser werden trotzdem MEHR. Die 60-110-ms-Bilder kamen also nie vom
;    Kochen.
;
; 2. "Dann liegt es am Entpacken." Unkomprimiert ergibt exakt dieselben Werte
;    bei dreieinhalbfacher Groesse (3.134 statt 899 MB). Auch falsch.
;
; Woher die Ausreisser im Paket wirklich kommen, ist OFFEN. Sie treten beim
; Nachladen von Zellen auf und sind im Paket haeufiger als im Editor-Build -
; ein Verdacht ohne Beleg ist das Registrieren der Actors selbst.
;
; bCompressed bleibt deshalb auf der Vorgabe: Dreieinhalbfache Groesse fuer
; null Wirkung waere ein schlechter Tausch.
;
; Was das Paket dagegen unbestreitbar bringt, steht in der letzten Spalte:
; 49 Sekunden bis zum Spiel statt 8 Minuten 44.

; Eine zentrale Dateiliste, gelesen von WiesbadenReal.Build.cs:
; UFS-Staging unter $(ProjectDir)/<RuntimeFile> erhaelt die bestehenden
; FPaths::ProjectDir/ProjectContentDir + FFileHelper-Ladepfade auch im Paket.
; NUR diese JSON, niemals Data/Raw als Ganzes (OSM/DEM/FBX/Logs).
; Checks: python -m unittest discover -s Tools -p test_runtime_packaging.py
