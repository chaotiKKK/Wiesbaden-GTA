[/Script/UnrealEd.ProjectPackagingSettings]
; Spieldaten komprimiert lassen (Vorgabe) - die Alternative wurde gemessen.
;
; Gleiche Fahrt (-WbAutoDrive=50), 1600 x 900, je acht Fenster:
;
;   Build                        Bildzeit    Ausreisser   Kollisions-Kochen   Ladezeit
;   Editor (lose Dateien)        32-38 ms      0-6            826              8:44
;   Paket, komprimiert, kalt     37-47 ms      0-27             0              0:49
;   Paket, komprimiert, warm     36-47 ms      0-24             0
;   Paket, UNKOMPRIMIERT         36-47 ms      0-26             0
;
; Zwei meiner Vermutungen sind daran gescheitert:
;
; 1. "Das Paket beseitigt das Ruckeln, weil es das Kollisions-Kochen
;    mitbringt." Das Kochen faellt tatsaechlich von 826 auf 0 - und die
;    Ausreisser werden trotzdem MEHR. Die 60-110-ms-Bilder kamen also nie vom
;    Kochen.
;
; 2. "Dann liegt es am Entpacken." Unkomprimiert ergibt exakt dieselben Werte
;    bei dreieinhalbfacher Groesse (3.134 statt 899 MB). Auch falsch.
;
; Woher die Ausreisser im Paket wirklich kommen, ist OFFEN. Sie treten beim
; Nachladen von Zellen auf und sind im Paket haeufiger als im Editor-Build -
; ein Verdacht ohne Beleg ist das Registrieren der Actors selbst.
;
; bCompressed bleibt deshalb auf der Vorgabe: Dreieinhalbfache Groesse fuer
; null Wirkung waere ein schlechter Tausch.
;
; Was das Paket dagegen unbestreitbar bringt, steht in der letzten Spalte:
; 49 Sekunden bis zum Spiel statt 8 Minuten 44.
